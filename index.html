<script>
"use strict";
const $ = s => document.querySelector(s);
const CAT_COLORS = {text:"text-c", table:"table-c", image:"image-c", media:"media-c"};
const CATS = [["text","文本文档"],["table","表格数据"],["image","图片"],["media","音视频"]];
let CONVS = [], curConv = null, files = [], opts = {}, busy = false, timer = null, queue = [], onProg = null;

/* ================= 基础工具 ================= */
const MIME = {mp3:"audio/mpeg",mp4:"video/mp4",m4v:"video/mp4",wav:"audio/wav",flac:"audio/flac",ogg:"audio/ogg",
  gif:"image/gif",avi:"video/x-msvideo",webm:"video/webm",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",
  ico:"image/x-icon",bmp:"image/bmp",tiff:"image/tiff",html:"text/html;charset=utf-8",md:"text/markdown",
  txt:"text/plain;charset=utf-8",json:"application/json",csv:"text/csv",tsv:"text/tab-separated-values",
  yaml:"text/yaml",yml:"text/yaml",xml:"application/xml",pdf:"application/pdf",
  docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  ini:"text/plain",lrc:"text/plain",log:"text/plain"};
function blobOf(text, to){ return new Blob([text], {type: MIME[to] || "application/octet-stream"}); }
function readText(bytes){
  const u8 = new Uint8Array(bytes);
  for(const enc of ["utf-8","gb18030","big5"]){
    try{ return new TextDecoder(enc, {fatal:true}).decode(u8); }catch(e){}
  }
  return new TextDecoder("utf-8").decode(u8);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtSize(n){
  if(!n && n !== 0) return "";
  if(n < 1024) return n + " B";
  if(n < 1048576) return (n / 1024).toFixed(1) + " KB";
  if(n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(2) + " GB";
}
let toastTimer = null;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3400);
}
function setBar(pct, text){
  if(pct === null) $("#barFill").style.width = "70%";
  else $("#barFill").style.width = pct + "%";
  $("#pText").textContent = text;
}
function outFileName(name){
  const stem = name.replace(/\.[^.\\/]+$/, "");
  return stem + "." + curConv.to;
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 40000);
}
/* CSV */
function parseCSV(text){
  const rows = []; let row = [], cur = "", inq = false;
  const s = text.replace(/\r\n/g, "\n");
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(inq){
      if(c === '"'){ if(s[i+1] === '"'){ cur += '"'; i++; } else inq = false; }
      else cur += c;
    } else if(c === '"') inq = true;
    else if(c === ','){ row.push(cur); cur = ""; }
    else if(c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if(cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function toCSV(rows){
  return rows.map(r => r.map(c => {
    c = String(c === null || c === undefined ? "" : c);
    return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
  }).join(",")).join("\r\n");
}
function csvRows(text, sep){
  return text.replace(/\r\n/g, "\n").split("\n").map(l => l.split(sep));
}
function guessSep(text){
  const s = text.slice(0, 4096);
  if(s.includes("\t") && (!s.includes(",") || s.split("\t").length >= s.split(",").length)) return "\t";
  if(s.includes(";") && !s.includes(",")) return ";";
  return ",";
}
/* 图片 */
function loadImg(blob){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("无法解析该图片（浏览器不支持此格式）")); };
    im.src = u;
  });
}
async function canvasFrom(blob, white){
  const im = await loadImg(blob);
  const w = im.naturalWidth, h = im.naturalHeight;
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d");
  if(white){ ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); }
  ctx.drawImage(im, 0, 0, w, h);
  return cv;

  const size = 54 + rowSize * h;

  v.setUint8(0, 0x42); v.setUint8(1, 0x4d);
  v.setUint32(2, size, true); v.setUint32(10, 54, true);
  v.setUint32(14, 40, true); v.setInt32(18, w, true); v.setInt32(22, h, true);
  v.setUint16(26, 1, true); v.setUint16(28, 24, true); v.setUint32(34, size - 54, true);
  let off = 54;
  for(let y = h - 1; y >= 0; y--){
    const rowStart = off;
    for(let x = 0; x < w; x++){
      const i = (y * w + x) * 4;
      v.setUint8(off++, img[i + 2]);
      v.setUint8(off++, img[i + 1]);
      v.setUint8(off++, img[i]);
    }
    off = rowStart + rowSize;
  }
  return new Blob([buf], {type: "image/bmp"});
}

   因此改用「同源 Blob Worker + 直接 CDN」方案：Worker 由本页 Blob 创建（同源），
   内部再 importScripts 加载 CDN 上的引擎 chunk 与 core，从而绕开跨域跳转限制。

let ffmpegP = null, ffCDNBase = null;

function patchFFmpegWorker(){
  if(ffWorkerPatched) return;
  ffWorkerPatched = true;
  const chunk = ffCDNBase + "@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js";
  const blob = new Blob(['importScripts("' + chunk + '");'], {type: "text/javascript"});
  const blobURL = URL.createObjectURL(blob);
  const OrigWorker = window.Worker;
  function PatchedWorker(url, opts){
    const s = (url instanceof URL ? url.href : String(url));
    if(s.indexOf("814.ffmpeg.js") !== -1 || s.indexOf("/ffmpeg/") !== -1){
      return new OrigWorker(blobURL, opts);
    }
    return new OrigWorker(url, opts);
  }
  PatchedWorker.prototype = OrigWorker.prototype;
  window.Worker = PatchedWorker;
}
function getFFmpeg(){
  if(ffmpegP) return ffmpegP;
  ffmpegP = (async () => {
    onProg && onProg("正在加载网页版视频引擎（约 30MB，仅首次）…");
    if(!ffCDNBase) ffCDNBase = await loadLib(FFMPEG_LIB_PATH);
    patchFFmpegWorker();
    const { FFmpeg } = FFmpegWASM;
    const ff = new FFmpeg();
    await ff.load({coreURL: ffCDNBase + FFMPEG_CORE_PATH + "ffmpeg-core.js", wasmURL: ffCDNBase + FFMPEG_CORE_PATH + "ffmpeg-core.wasm"});
    return ff;

async function runMedia(srcName, bytes, args, to){
  const ff = await getFFmpeg();

  const inName = "in." + ext, out = "out." + to;
  await ff.writeFile(inName, new Uint8Array(bytes));
  try{
    const code = await ff.exec(["-hide_banner", "-y", "-i", inName].concat(args).concat([out]));
    if(code !== 0) throw new Error("ffmpeg 转换失败（错误码 " + code + "），该格式可能不受网页版引擎支持");
    const data = await ff.readFile(out);
    return new Blob([data.buffer], {type: MIME[to] || "application/octet-stream"});

/* TXT → PDF */
CONV.txt2pdf = async ({bytes, text}) => {
  const t = text !== undefined ? text : readText(bytes);
  if(!window.jspdf) throw new Error("PDF 引擎加载失败");
  const { jsPDF } = window.jspdf;
  const W = 595, H = 842, m = 46, lh = 15, fs = 11, S = 2;
  const pdf = new jsPDF("p", "pt", "a4");
  const cw = (W - m * 2) * S, ch = (H - m * 2) * S;
  const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
  const ctx = cv.getContext("2d");
  ctx.font = fs * S + "px sans-serif";
  ctx.fillStyle = "#000";
  const lines = t.replace(/\r\n/g, "\n").split("\n");
  let y = fs * S, pageDrawn = false;
  const wrap = (line) => {
    const out = [];
    if(ctx.measureText(line).width <= cw){ return [line]; }
    let cur = "";
    for(const ch of line){
      if(ctx.measureText(cur + ch).width > cw){ out.push(cur); cur = ch; }
      else cur += ch;
    }
    if(cur) out.push(cur);
    return out;
  };
  const flush = () => {
    if(!pageDrawn) return;
    pdf.addImage(cv.toDataURL("image/jpeg", 0.9), "JPEG", m, m, W - m * 2, H - m * 2);
    ctx.clearRect(0, 0, cw, ch);
    y = fs * S; pageDrawn = false;
  };
  for(const line of lines){
    const ws = wrap(line || " ");
    for(const w of ws){
      if(y > ch - lh * S){ flush(); pdf.addPage(); }
      ctx.fillText(w, 0, y);
      y += lh * S; pageDrawn = true;
    }
  }
  flush();

    if(!kids.length) return el.textContent;
    const o = {};
    const seen = {};
    kids.forEach(k => {
      const v = conv(k);
      const key = k.tagName;
      if(seen[key] === undefined){ o[key] = v; seen[key] = true; }
      else { if(!Array.isArray(o[key])) o[key] = [o[key]]; o[key].push(v); }
    });
    return o;
  };
  const obj = {};
  Array.from(d.documentElement.children).forEach(k => { obj[k.tagName] = conv(k); });
  if(!Object.keys(obj).length) obj[d.documentElement.tagName] = d.documentElement.textContent;
  return blobOf(JSON.stringify(obj, null, 2), "json");
};

/* JSON → Markdown */
CONV.json2md = async ({bytes, text}) => {
  const t = text !== undefined ? text : readText(bytes);
  const obj = JSON.parse(t);
  const escCell = c => String(c).replace(/\|/g, "\\|").replace(/\n/g, "<br>");
  if(Array.isArray(obj) && obj.length && typeof obj[0] === "object"){
    const head = Object.keys(obj[0]);
    const rows = obj.map(o => head.map(k => o[k] !== undefined && o[k] !== null ? o[k] : ""));
    return blobOf("| " + head.map(escCell).join(" | ") + " |\n| " + head.map(() => "---").join(" | ") + " |\n" +
      rows.map(r => "| " + r.map(escCell).join(" | ") + " |").join("\n"), "md");
  }
  return blobOf("```json\n" + JSON.stringify(obj, null, 2) + "\n```\n", "md");
};

CONV.png2ico = async ({bytes}) => {
  let cv = await canvasFrom(imgBlob(bytes, "image/png"), false);
  if(cv.width > 256 || cv.height > 256){
    const s = 256 / Math.max(cv.width, cv.height);
    const c2 = document.createElement("canvas"); c2.width = Math.round(cv.width * s); c2.height = Math.round(cv.height * s);
    c2.getContext("2d").drawImage(cv, 0, 0, c2.width, c2.height);
    cv = c2;
  }
  return await encodeICO(cv);
};
CONV.tiff2png = async ({bytes}) => {
  if(!window.UTIF) throw new Error("TIFF 引擎未加载");
  const buf = new Uint8Array(bytes).buffer;
  const ifds = UTIF.decode(buf);
  if(!ifds || !ifds.length) throw new Error("TIFF 解析失败");
  UTIF.decodeImage(buf, ifds[0]);
  const cv = UTIF.toCanvas(ifds[0]);
  return await toBlobP(cv, "image/png");
};

};

const LIB_BASES = ["https://cdn.jsdelivr.net/npm/", "https://fastly.jsdelivr.net/npm/", "https://unpkg.com/"];
const libCache = {};
function loadScriptFromBase(base, path){
  const url = base + path;
  return libCache[url] || (libCache[url] = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = url;
    s.onload = () => res();
    s.onerror = () => { delete libCache[url]; rej(new Error("依赖库加载失败：" + url)); };
    document.head.appendChild(s);
  }));
}
async function loadLib(path){
  let lastErr = null;
  for(const base of LIB_BASES){
    try{ await loadScriptFromBase(base, path); return base; }
    catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("依赖库加载失败");
}

function renderOptions(schema){
  const box = $("#options"); box.innerHTML = "";
  schema.forEach(o => {
    opts[o.key] = o.default;
    let ctl = "";
    if(o.type === "bool"){
      ctl = '<label class="chk"><input type="checkbox" data-k="' + o.key + '"' + (o.default ? " checked" : "") + '> ' + o.label + '</label>';
    }else if(o.type === "select"){
      ctl = '<label>' + o.label + ' <select data-k="' + o.key + '">' +
        o.options.map(([v, l]) => '<option value="' + v + '"' + (String(o.default) === String(v) ? " selected" : "") + '>' + l + '</option>').join("") +
        '</select></label>';
    }else if(o.type === "range"){
      ctl = '<label>' + o.label + ' <span class="rval" id="rv-' + o.key + '">' + o.default + '</span> <input type="range" data-k="' + o.key + '" min="' + o.min + '" max="' + o.max + '" value="' + o.default + '"></label>';
    }else{
      ctl = '<label>' + o.label + ' <input type="number" data-k="' + o.key + '" min="' + (o.min ?? 1) + '" max="' + (o.max ?? 60) + '" value="' + o.default + '"></label>';
    }
    const w = document.createElement("div"); w.className = "opt"; w.innerHTML = ctl;
    box.appendChild(w);
    const input = w.querySelector("[data-k]");
    input.addEventListener("input", () => {
      let v = input.type === "checkbox" ? input.checked : input.value;
      if(input.type === "number" || input.type === "range") v = Number(v);
      opts[o.key] = v;
      if(input.type === "range"){
        const rv = document.getElementById("rv-" + o.key);
        if(rv) rv.textContent = v;
      }
    });
  });
}

}

$("#goBtn").onclick = () => {
  if(busy) return;
  if(curConv.text_input){
    if(!$("#textInput").value.trim()){ toast("请先粘贴需要转换的文本"); return; }
    queue = [null];
  }else{
    if(!files.length){ toast("请先选择要转换的文件"); return; }
    queue = files.slice();
  }
  busy = true; $("#goBtn").disabled = true;
  next();
};
function next(){
  if(!queue.length){
    busy = false; $("#goBtn").disabled = false;
    $("#progress").hidden = true; clearInterval(timer);
    $("#goHint").textContent = "全部完成";
    return;
  }
  const item = queue.shift();
  convertOne(item);
}
async function convertOne(file){
  const label = file ? file.name : "粘贴文本";
  $("#progress").hidden = false;
  setBar(0, "准备中…");
  const t0 = Date.now();
  clearInterval(timer);
  timer = setInterval(() => setBar(null, "转换中… " + Math.round((Date.now() - t0) / 1000) + " 秒"), 1000);
  try{
    onProg = t => setBar(null, t);
    await ensureLibs(curConv.id);
    const input = file ? {name: label, bytes: await file.arrayBuffer()} : {name: label, text: $("#textInput").value};
    const blob = await CONV[curConv.id](input, opts);
    const outName = outFileName(label);
    addResult(label, outName, URL.createObjectURL(blob), blob.size, null);
  }catch(e){
    addResult(label, null, null, 0, (e && e.message) || String(e));
  }finally{
    onProg = null;
  }
  next();
}
function addResult(srcName, outName, url, size, err){
  const box = $("#results");
  const row = document.createElement("div");
  row.className = "ritem" + (err ? " err" : "");
  if(err){
    row.innerHTML = '<span class="okmark">✕</span><span class="rname">' + esc(srcName) + '</span><span class="rmsg" title="' + esc(err) + '">' + esc(err) + '</span>';
  }else{
    row.innerHTML = '<span class="okmark">✓</span><span class="rname">' + esc(outName) + '</span>' +
      '<span class="rsize">' + fmtSize(size) + '</span>' +
      '<button class="dl" data-url="' + url + '" data-name="' + esc(outName) + '">下载</button>';
    row.querySelector(".dl").onclick = e => {
      const a = document.createElement("a");
      a.href = e.currentTarget.dataset.url;
      a.download = e.currentTarget.dataset.name;
      document.body.appendChild(a); a.click(); a.remove();
    };
  }
  box.prepend(row);
}

$("#footEngines").textContent = "已内置：文档 · 表格 · 图片 · 音视频（ffmpeg）引擎，随用随载";
renderTabs();
renderGrid();
</script>
